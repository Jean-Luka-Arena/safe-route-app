services:
  db:
    image: postgres:16
    container_name: safe_route_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: safe_route
      POSTGRES_USER: safe_route
      POSTGRES_PASSWORD: safe_route
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: safe_route_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://safe_route:safe_route@db:5432/safe_route
      SECRET_KEY: ${SECRET_KEY:-cambiar-esto-en-produccion}
    ports:
      - "8000:8000"

volumes:
  db_data: