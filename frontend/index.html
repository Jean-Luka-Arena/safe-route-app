<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safe Route</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bienvenida-modal">
    <div class="bienvenida-contenido">
      <h2>Safe Route</h2>
      <p>Planificá tu ruta según qué tan segura o corta la querés.</p>

      <label>
        Email
        <input type="email" id="bienvenida-email-input" autocomplete="off" />
      </label>
      <label>
        Contraseña
        <input
          type="password"
          id="bienvenida-password-input"
          autocomplete="off"
        />
      </label>

      <div class="botones-cuenta">
        <button id="bienvenida-login">Iniciar sesión</button>
        <button id="bienvenida-registro">Registrarme</button>
      </div>

      <div id="bienvenida-error"></div>

      <hr />

      <button id="bienvenida-invitado">Continuar como invitado</button>
      <p class="bienvenida-nota">
        Como invitado podés calcular rutas, pero no reportar incidentes.
      </p>
    </div>
  </div>

  <header>
    <h1>Safe Route</h1>
    <p>Elegí un origen, un destino y qué te importa más al movilizarte.</p>
  </header>

  <main>
    <div id="mapa"></div>

    <aside id="panel">
      <div id="cuenta-logueada" hidden>
        <span id="cuenta-email"></span>
        <button id="cerrar-sesion">Cerrar sesión</button>
      </div>

      <details id="cuenta-desconectada">
        <summary>👤 Iniciar sesión / Registrarme</summary>

        <label>
          Email
          <input type="email" id="cuenta-email-input" autocomplete="off" />
        </label>
        <label>
          Contraseña
          <input type="password" id="cuenta-password-input" autocomplete="off" />
        </label>

        <div class="botones-cuenta">
          <button id="cuenta-login">Iniciar sesión</button>
          <button id="cuenta-registro">Registrarme</button>
        </div>

        <div id="cuenta-error"></div>
      </details>

      <hr />

      <div class="buscador">
        <label>
          Origen
          <input
            type="text"
            id="origen-input"
            placeholder="Ej: Av. Maipú 1500"
            autocomplete="off"
          />
        </label>
        <div id="origen-sugerencias" class="sugerencias" hidden></div>
      </div>

      <div class="buscador">
        <label>
          Destino
          <input
            type="text"
            id="destino-input"
            placeholder="Ej: Plaza Alsina"
            autocomplete="off"
          />
        </label>
        <div id="destino-sugerencias" class="sugerencias" hidden></div>
      </div>

      <label>
        Criterio
        <select id="criterio">
          <option value="corta">Más corta</option>
          <option value="segura">Más segura</option>
          <option value="balanceada">Balanceada</option>
        </select>
      </label>

      <div id="pesos" hidden>
        <label>
          Alpha (peso distancia)
          <input type="number" id="alpha" min="0" max="1" step="0.1" value="0.5" />
        </label>
        <label>
          Beta (peso riesgo)
          <input type="number" id="beta" min="0" max="1" step="0.1" value="0.5" />
        </label>
      </div>

      <button id="calcular">Calcular ruta</button>

      <div id="resultado"></div>
      <div id="error"></div>

      <hr />

      <details id="detalles-reporte">
        <summary>📮 Reportar un incidente</summary>

        <div class="buscador">
          <label>
            ¿Dónde ocurrió?
            <input
              type="text"
              id="incidente-direccion-input"
              placeholder="Ej: Av. Maipú 1500"
              autocomplete="off"
            />
          </label>
          <div
            id="incidente-direccion-sugerencias"
            class="sugerencias"
            hidden
          ></div>
        </div>

        <label>
          ¿Qué tipo de incidente fue?
          <select id="incidente-tipo">
            <option value="robo">Robo</option>
            <option value="zona_oscura">Zona oscura</option>
            <option value="calle_bloqueada">Calle bloqueada</option>
            <option value="accidente">Accidente</option>
          </select>
        </label>

        <button id="incidente-enviar">Enviar reporte</button>

        <div id="incidente-resultado"></div>
        <div id="incidente-error"></div>

        <hr />

        <h3>Mis reportes</h3>
        <ul id="lista-mis-reportes"></ul>
      </details>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
